name: Feature request
description: A new Kyber route or design capability
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: Problem
      description: What a caller cannot do with the current API.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Method, path, and how it fits the existing collections or design-handler.
    validations:
      required: true
