name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Full jar build needs HCL DRAPI keep-* JARs on a Domino host.
# verify = metadata; unit = optional self-hosted when vars.KYBER_SELF_HOSTED_UNIT=true.
# CodeQL covers static analysis. Smoke stays in tools/release-gate.ps1 (Kyber lab host).
# This workflow does not call Aldhani or Yavin.

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Version sync (pom / READMEs / OpenAPI)
        shell: pwsh
        run: ./tools/check-version-sync.ps1

  unit:
    if: ${{ vars.KYBER_SELF_HOSTED_UNIT == 'true' }}
    runs-on: [self-hosted, Windows, kyber]
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests (DRAPI_HOME on runner)
        shell: pwsh
        run: |
          if (-not $env:DRAPI_HOME) {
            throw "Self-hosted runner must set DRAPI_HOME to the Domino REST install"
          }
          ./tools/run-unit-tests.ps1
